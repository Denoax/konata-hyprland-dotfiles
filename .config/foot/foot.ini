# Caelestia-derived interaction with compact Kona window padding.
shell=fish
title=Kona Terminal
font=JetBrains Mono Nerd Font:size=12
letter-spacing=0
dpi-aware=no
pad=18x10
bold-text-in-bright=no
gamma-correct-blending=no
include=~/.config/kona/theme/current/foot.ini

[scrollback]
lines=10000

[cursor]
style=beam
beam-thickness=1.5

[colors-dark]
alpha=0.78
alpha-mode=matching
blur=yes

[key-bindings]
scrollback-up-page=Page_Up
scrollback-down-page=Page_Down
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+G
