font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
font_size 11.5

background #08111f
foreground #eef5ff
selection_background #224267
selection_foreground #f7faff
cursor #7db7ff
cursor_text_color #08111f
url_color #60a5fa

color0 #08111f
color1 #ff7891
color2 #56e39f
color3 #f5cf65
color4 #3b82f6
color5 #8d7df2
color6 #60a5fa
color7 #aabbd0
color8 #40546a
color9 #ff9bad
color10 #7af0b7
color11 #ffe18a
color12 #93c5fd
color13 #b9aaff
color14 #7db7ff
color15 #f7faff

background_opacity 0.86
background_blur 18
dynamic_background_opacity yes
window_padding_width 12
window_border_width 0
draw_minimal_borders yes
confirm_os_window_close 0
enable_audio_bell no
tab_bar_style separator
active_tab_background #3b82f6
active_tab_foreground #f7faff
inactive_tab_background #12213a
inactive_tab_foreground #aabbd0
shell_integration enabled

# Kona's appearance owner generates colors only; window/font geometry remains above.
include ~/.config/kona/theme/current/kitty.conf
