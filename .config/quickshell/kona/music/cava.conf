# Same native PipeWire source as Kona's existing CAVA configuration.
# The popup owns this process only while open and media is playing.
[general]
framerate = 24
bars = 21
autosens = 1
[input]
method = pipewire
source = auto
[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
channels = mono
[smoothing]
noise_reduction = 77
