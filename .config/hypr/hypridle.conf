general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}

listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

listener {
    timeout = 960
    # Samsung HDMI-A-1 can remain black after DPMS wake. Keep it powered
    # behind hyprlock; only sleep the Pixio and Acer. Lock timing is unchanged.
    on-timeout = pidof hyprlock && hyprctl dispatch 'hl.dsp.dpms({action = "disable", monitor = "DP-4"})' && hyprctl dispatch 'hl.dsp.dpms({action = "disable", monitor = "HDMI-A-5"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "enable"})'
}
