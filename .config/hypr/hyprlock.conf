$font = JetBrainsMono Nerd Font
$wall = ~/.local/share/wallpapers/konata-command-center/v2

general {
    hide_cursor = true
    grace = 2
}

animations {
    enabled = true
    bezier = kona, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, kona
    animation = fadeOut, 1, 4, kona
    animation = inputFieldDots, 1, 3, kona
}

background {
    monitor = HDMI-A-1
    path = $wall/selected.png
    blur_passes = 2
    blur_size = 5
}
background {
    monitor = DP-4
    path = $wall/selected.png
    blur_passes = 2
    blur_size = 5
}
background {
    monitor = HDMI-A-5
    path = $wall/selected.png
    blur_passes = 2
    blur_size = 5
}

label {
    monitor = DP-4
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(101, 220, 255, 1.0)
    font_size = 112
    font_family = $font
    position = 0, 180
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = cmd[update:60000] date +"ARCH LINUX  //  %A, %B %d"
    color = rgba(175, 235, 255, 0.9)
    font_size = 18
    font_family = $font
    position = 0, 90
    halign = center
    valign = center
}

input-field {
    monitor = DP-4
    size = 420, 54
    outline_thickness = 1
    inner_color = rgba(5, 20, 36, 0.78)
    outer_color = rgba(0, 200, 255, 0.92)
    check_color = rgba(74, 222, 128, 0.92)
    fail_color = rgba(248, 113, 113, 0.92)
    font_color = rgba(220, 247, 255, 1.0)
    fade_on_empty = false
    rounding = 8
    font_family = $font
    placeholder_text = <i>password // press enter</i>
    fail_text = <i>access denied // $FAIL</i>
    dots_spacing = 0.32
    position = 0, -20
    halign = center
    valign = center
}
