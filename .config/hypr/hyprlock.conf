$font = JetBrainsMono Nerd Font
$lock = ~/.config/kona/lockscreen/mono-rain

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = kona, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 4, kona
    animation = fadeOut, 1, 5, kona
    animation = inputFieldDots, 1, 2, kona
    animation = inputFieldColors, 1, 2, kona
}

background {
    monitor = HDMI-A-1
    path = $lock/background/konata-lock-static-fallback.png
    blur_passes = 0
    noise = 0.006
    brightness = 0.90
    zindex = -2
}
background {
    monitor = DP-4
    path = $lock/background/konata-lock-base.png
    blur_passes = 0
    noise = 0.006
    brightness = 0.90
    zindex = -2
}
background {
    monitor = HDMI-A-5
    path = $lock/background/konata-lock-static-fallback.png
    blur_passes = 0
    noise = 0.006
    brightness = 0.90
    zindex = -2
}

# One decorative command surface renders the shipped deterministic 80-frame rain cycle.
# It never receives input; the native Hyprlock input-field below remains the only key owner.
label {
    monitor = DP-4
    text = cmd[update:125] $lock/kona-lock-rain-frame
    color = rgba(132, 166, 196, 0.45)
    font_size = 13
    font_family = $font
    text_align = left
    position = 28, 0
    halign = left
    valign = center
    zindex = -1
}

# Authentication card, centered over the left-side rain without covering Konata.
shape {
    monitor = DP-4
    size = 440, 630
    color = rgba(4, 10, 18, 0.76)
    rounding = 20
    border_size = 1
    border_color = rgba(142, 181, 213, 0.40)
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(0, 0, 0, 0.72)
    shadow_boost = 1.2
    position = -443, 0
    halign = center
    valign = center
    zindex = 0
}

label {
    monitor = DP-4
    text = $TIME
    color = rgba(230, 238, 245, 1.0)
    font_size = 84
    font_family = $font
    position = -443, 238
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-4
    text = cmd[update:60000] date +"%a, %b %d" | tr '[:lower:]' '[:upper:]'
    color = rgba(166, 184, 200, 0.92)
    font_size = 18
    font_family = $font
    position = -443, 166
    halign = center
    valign = center
    zindex = 1
}

shape {
    monitor = DP-4
    size = 48, 1
    color = rgba(154, 187, 214, 0.48)
    rounding = 1
    position = -443, 130
    halign = center
    valign = center
    zindex = 1
}

image {
    monitor = DP-4
    path = $lock/avatar/konata-avatar-512.png
    size = 124
    rounding = -1
    border_size = 2
    border_color = rgba(195, 222, 242, 0.90)
    shadow_passes = 3
    shadow_size = 10
    shadow_color = rgba(110, 176, 224, 0.46)
    shadow_boost = 1.1
    position = -443, 58
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-4
    text = K O N A
    color = rgba(223, 234, 242, 0.98)
    font_size = 18
    font_family = $font
    position = -443, -32
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-4
    text = $USER
    color = rgba(146, 167, 184, 0.95)
    font_size = 13
    font_family = $font
    position = -443, -62
    halign = center
    valign = center
    zindex = 1
}

input-field {
    monitor = DP-4
    size = 360, 58
    outline_thickness = 1
    inner_color = rgba(11, 21, 31, 0.92)
    outer_color = rgba(131, 169, 201, 0.72)
    check_color = rgba(177, 218, 244, 0.96)
    fail_color = rgba(213, 112, 119, 0.94)
    capslock_color = rgba(225, 186, 109, 0.94)
    numlock_color = rgba(131, 169, 201, 0.72)
    font_color = rgba(225, 237, 246, 1.0)
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = Enter password
    check_text = Checking…
    fail_text = Try again · $FAIL
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    hide_input = false
    position = -443, -144
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor = DP-4
    text = GOOD THINGS AWAIT  //  らき☆すた
    color = rgba(119, 140, 157, 0.78)
    font_size = 10
    font_family = $font
    position = -443, -240
    halign = center
    valign = center
    zindex = 1
}
